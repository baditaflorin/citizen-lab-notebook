<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Citizen Lab Notebook</title>
    <meta
      name="description"
      content="Browser lab notebook that captures experiments, analyzes data, and generates science-fair-ready reports."
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f2;
        color: #17211b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(760px, calc(100vw - 40px));
      }

      h1 {
        font-size: clamp(2rem, 6vw, 4.5rem);
        margin: 0 0 16px;
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.7;
      }

      a {
        color: #005f73;
        font-weight: 700;
      }

      .meta {
        margin-top: 32px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: #526056;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Citizen Lab Notebook</h1>
      <p>
        The static GitHub Pages shell is live. The full science notebook app is being built in this
        repository.
      </p>
      <p>
        Repository:
        <a href="https://github.com/baditaflorin/citizen-lab-notebook"
          >https://github.com/baditaflorin/citizen-lab-notebook</a
        >
      </p>
      <p>
        Support:
        <a href="https://www.paypal.com/paypalme/florinbadita"
          >https://www.paypal.com/paypalme/florinbadita</a
        >
      </p>
      <div class="meta">
        <span>Version 0.1.0</span>
        <span>Commit pending first release</span>
      </div>
    </main>
  </body>
</html>
